name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt update && sudo apt install -y cmake build-essential rpm
    - name: Configure CMake
      run: cmake -B build -S .
    - name: Build
      run: cmake --build build
    - name: Run tests
      run: cd build && ctest --output-on-failure || echo "No tests found"
    - name: Create DEB package
      run: cd build && cpack -G DEB
    - name: Create RPM package
      run: cd build && cpack -G RPM
    - name: Create TGZ package
      run: cd build && cpack -G TGZ
    - name: Upload Linux packages
      uses: actions/upload-artifact@v4
      with:
        name: linux-packages
        path: build/*.deb build/*.rpm build/*.tar.gz

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install WiX Toolset
      run: choco install wixtoolset --version=3.14.0.8722 -y
    - name: Install CMake
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
    - name: Add WiX to PATH
      run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH
    - name: Configure CMake
      run: cmake -B build -S .
    - name: Build
      run: cmake --build build --config Release
    - name: Create MSI package
      run: cd build && cpack -G WIX
    - name: Upload Windows packages
      uses: actions/upload-artifact@v4
      with:
        name: windows-packages
        path: build/*.msi

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install cmake
    - name: Configure CMake
      run: cmake -B build -S .
    - name: Build
      run: cmake --build build
    - name: Create DMG package
      run: cd build && cpack -G DragNDrop
    - name: Upload macOS packages
      uses: actions/upload-artifact@v4
      with:
        name: macos-packages
        path: build/*.dmg

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: List packages
      run: ls -la artifacts/*/*
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
