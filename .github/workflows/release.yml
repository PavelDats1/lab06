name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt update && sudo apt install -y cmake build-essential rpm
    - name: Configure
      run: cmake -B build -S .
    - name: Build
      run: cmake --build build
    - name: Test
      run: cd build && ctest --output-on-failure
    - name: Create DEB
      run: cd build && cpack -G DEB
    - name: Create RPM
      run: cd build && cpack -G RPM
    - name: Create TGZ
      run: cd build && cpack -G TGZ
    - name: Upload Linux
      uses: actions/upload-artifact@v4
      with:
        name: linux-packages
        path: build/*.deb build/*.rpm build/*.tar.gz

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install CMake
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
    - name: Configure
      run: cmake -B build -S .
    - name: Build
      run: cmake --build build --config Release
    - name: Create MSI
      run: cd build && cpack -G WIX
    - name: Upload Windows
      uses: actions/upload-artifact@v4
      with:
        name: windows-packages
        path: build/*.msi

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install cmake
    - name: Configure
      run: cmake -B build -S .
    - name: Build
      run: cmake --build build
    - name: Create DMG
      run: cd build && cpack -G DragNDrop
    - name: Upload macOS
      uses: actions/upload-artifact@v4
      with:
        name: macos-packages
        path: build/*.dmg

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Debug packages
      run: |
        find artifacts -type f
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/linux-packages/*
          artifacts/windows-packages/*
          artifacts/macos-packages/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
